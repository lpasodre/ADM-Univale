<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo UNIVALE</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      position: relative;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    canvas {
      border: 2px solid #ffffff;
      background-color: #f4f4f9;
      display: block;
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // Configurações Globais
  const LARGURA = canvas.width;
  const ALTURA = canvas.height;
  const ALTURA_CHAO = 80; // Espessura da grama/chão
  const Y_CHAO = ALTURA - ALTURA_CHAO;

  // Identidade Visual UNIVALE
  const COR_GRAMA_UNIVALE = "#002A5C"; // Azul-marinho

  // Cores que mudam a cada período (fase/tempo)
  const CORES_PERIODOS = [
    "#E63946", // Período 1 - Vermelho
    "#F4A261", // Período 2 - Laranja
    "#2A9D8F", // Período 3 - Verde
    "#E76F51", // Período 4 - Coral
    "#9B5DE5"  // Período 5 - Roxo
  ];

  // Estado do Jogo
  let tempoInicio = Date.now();
  let obstaculos = [
    { x: 500, y: Y_CHAO - 40, largura: 30, altura: 40 },
    { x: 750, y: Y_CHAO - 50, largura: 35, altura: 50 }
  ];

  // 1. Desenhar a marca d'água "UNIVALE" grande ao fundo estilo SEGA
  function desenharFundoUNIVALE() {
    ctx.save();
    
    // Suave opacidade para não prejudicar a visão dos elementos do jogo
    ctx.globalAlpha = 0.08; 
    
    ctx.font = "900 130px 'Arial Black', Impact, sans-serif";
    ctx.fillStyle = "#002A5C";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // Desenha centralizado na tela
    ctx.fillText("UNIVALE", LARGURA / 2, (ALTURA - ALTURA_CHAO) / 2);

    ctx.restore();
  }

  // 2. Desenhar a grama/chão em azul-marinho da UNIVALE
  function desenharGrama() {
    ctx.fillStyle = COR_GRAMA_UNIVALE;
    ctx.fillRect(0, Y_CHAO, LARGURA, ALTURA_CHAO);
  }

  // Obter a cor dos obstáculos baseada no tempo decorrido (muda a cada 5s)
  function getCorObstaculoAtual(tempoDecorrido) {
    const periodo = Math.floor(tempoDecorrido / 5); // Troca a cada 5 segundos
    const indiceCor = periodo % CORES_PERIODOS.length;
    return {
      cor: CORES_PERIODOS[indiceCor],
      numeroPeriodo: periodo + 1
    };
  }

  // 3. Desenhar Caixinhas Obstáculos com a cor do período
  function desenharObstaculos(tempoSegundos) {
    const infoPeriodo = getCorObstaculoAtual(tempoSegundos);

    obstaculos.forEach(obs => {
      // Mover obstáculo para simular o jogo rodando
      obs.x -= 3;
      if (obs.x + obs.largura < 0) {
        obs.x = LARGURA + Math.random() * 200;
      }

      // Desenhar o obstáculo
      ctx.fillStyle = infoPeriodo.cor;
      ctx.fillRect(obs.x, obs.y, obs.largura, obs.altura);

      // Borda nos obstáculos para destaque
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 2;
      ctx.strokeRect(obs.x, obs.y, obs.largura, obs.altura);
    });

    // Indicador na tela mostrando o período atual e a cor correspondente
    ctx.fillStyle = "#000";
    ctx.font = "bold 16px Arial";
    ctx.fillText(`Período Atual: ${infoPeriodo.numeroPeriodo}`, 20, 30);
  }

  // Loop principal do jogo
  function gameLoop() {
    const tempoDecorridoSegundos = (Date.now() - tempoInicio) / 1000;

    // Limpa a tela
    ctx.clearRect(0, 0, LARGURA, ALTURA);

    // Renderiza os elementos na ordem correta de camadas
    desenharFundoUNIVALE();
    desenharGrama();
    desenharObstaculos(tempoDecorridoSegundos);

    requestAnimationFrame(gameLoop);
  }

  // Iniciar o jogo
  gameLoop();
</script>

</body>
</html>
